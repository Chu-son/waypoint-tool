[package]
name = "waypoint-tool"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "waypoint_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
csv = "1.4.0"
handlebars = "6.4.0"
image = "0.25.9"
# image が既に使っている共有スレッドプール。ブレンドとレイヤーのデコードの並列化に使う。
rayon = "1.11"
base64 = { version = "0.22.1", features = ["alloc"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-window-state = "2.4.1"
flate2 = "1.1.9"
semver = "1.0"
tempfile = "3.25.0"
ureq = "2"
minijinja = { version = "2.24.0", features = ["json", "loop_controls"] }

[dev-dependencies]

# 開発ビルド（`tauri dev`・`cargo test`）では、地図画像の PNG/PGM のデコード・エンコードと base64 が最適化なしで動き、
# リリースビルドの数十倍遅い。画像まわりの依存だけを最適化する（自前のコードはデバッグしやすいまま）。
# リリースビルドには影響しない。
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
[profile.dev.package.crossbeam-deque]
opt-level = 3
[profile.dev.package.crossbeam-epoch]
opt-level = 3

